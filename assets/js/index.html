<!-- ⭐ CATEGORY FILTERING -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    document.querySelectorAll("[data-category]").forEach(btn => {
        btn.addEventListener("click", () => {
            const cat = btn.dataset.category;

            // Use the global allProducts loaded by products.js
            let list;

            if (cat === "All") {
                list = allProducts;
            } else {
                list = allProducts.filter(p => p.type === cat);
            }

            // ⭐ Re-render products
            renderProducts(list);

            // ⭐ Re-attach cart UI
            setupIndexCartButtons();
        });
    });

});
</script>
