<script>
(function() {
  function safeUpdateCart() {
    try {
      // If there are multiple #cart-preview nodes, pick the one inside the visible nav
      const previews = Array.from(document.querySelectorAll('#cart-preview'));
      let preview = null;
      if (previews.length === 1) {
        preview = previews[0];
      } else if (previews.length > 1) {
        // prefer the one inside a visible nav.navbar
        preview = previews.find(p => p.closest('nav.navbar')) || previews[0];
      }

      // If the expected cart elements exist, call updateCartHeader
      const countEl = document.querySelector('nav.navbar #cart-count');
      const totalEl = document.querySelector('#cart-total');
      if (countEl && preview && totalEl && typeof updateCartHeader === 'function') {
        updateCartHeader();
        return true;
      }
      // fallback: still call updateCartHeader if function exists (defensive)
      if (typeof updateCartHeader === 'function') {
        updateCartHeader();
        return true;
      }
    } catch (err) {
      console.warn('safeUpdateCart error', err);
    }
    return false;
  }

  function whenReady(cb) {
    // If DOM ready and products already loaded, run immediately
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      if (Array.isArray(window.allProducts) && window.allProducts.length) {
        cb();
        return;
      }
    }

    // Listen for products ready event first
    window.addEventListener('products:loaded', function onLoaded() {
      window.removeEventListener('products:loaded', onLoaded);
      cb();
    }, { once: true });

    // Also ensure DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
      // If products already loaded by this point, cb will run via products:loaded handler
      // otherwise, keep polling below
    });

    // Poll as a fallback for up to 3 seconds
    let tries = 0;
    const poll = setInterval(() => {
      tries++;
      if (Array.isArray(window.allProducts) && window.allProducts.length && document.querySelector('nav.navbar #cart-count')) {
        clearInterval(poll);
        cb();
      } else if (tries > 30) {
        clearInterval(poll);
      }
    }, 100);
  }

  whenReady(() => {
    // Try immediately, then repeat a few times to cover late DOM mutations
    safeUpdateCart();
    let attempts = 0;
    const t = setInterval(() => {
      attempts++;
      safeUpdateCart();
      if (attempts > 10) clearInterval(t);
    }, 200);
  });
})();
</script>
