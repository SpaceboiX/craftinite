<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Product - Craftinite</title>

    <!-- Social / SEO -->
    <meta property="twitter:image" content="https://www.craftinite.co.uk/assets/img/icons/meta.png">
    <meta property="twitter:description" content="Handmade cards, bookmarks, mugs and more — crafted with care.">
    <meta property="twitter:title" content="Craftinite — Crafting the best solution for you">
    <meta property="twitter:url" content="https://craftinite.co.uk/">
    <meta property="twitter:card" content="summary_small_image">

    <meta property="og:description" content="Handmade cards, bookmarks, mugs and more — crafted with care.">
    <meta property="og:title" content="Craftinite — Crafting the best solution for you">
    <meta property="og:url" content="https://craftinite.co.uk/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/img/icons/meta.png">

    <meta name="description" content="Handmade cards, bookmarks, mugs and more — crafted with care.">
    <meta name="title" content="Craftinite — Crafting the best solution for you">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800&display=swap">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Header injected by nav.js -->
    <div id="header-placeholder"></div>

    <!-- Product Content -->
    <div class="container py-5">

        <!-- Title + Subtext -->
        <h1 id="product-title"></h1>
        <p id="product-subtext" class="text-muted mb-4"></p>

        <div class="row">

            <!-- LEFT: Gallery -->
            <div class="col-md-6 mb-4">
                <div id="product-gallery"></div>
            </div>

            <!-- RIGHT: Description + Quantity -->
            <div class="col-md-6 d-flex flex-column justify-content-start">

                <p id="product-description" class="mb-4"></p>

                <!-- Quantity Selector (always visible) -->
                <div class="d-flex align-items-center mb-3" id="quantity-wrapper">
                    <button class="btn btn-outline-light" id="qty-minus">−</button>
                    <input type="number" id="qty-input" class="form-control mx-2 text-center" value="0" min="0" style="width: 80px;">
                    <button class="btn btn-outline-light" id="qty-plus">+</button>
                </div>

            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark">
        <div class="container py-4 py-lg-5">
            <div class="text-muted d-flex justify-content-between align-items-center pt-3">
                <p class="mb-0">Copyright © 2025 Craftinite</p>
            </div>
        </div>
    </footer>

    <!-- Toast Container -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
        <div id="cart-toast" class="toast text-bg-success border-0" role="alert">
            <div class="toast-body">
                Added to cart!
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/bold-and-dark.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="assets/js/login-firebase.js"></script>

    <!-- Header loader -->
    <script src="assets/js/nav.js"></script>

    <!-- Product system -->
    <script src="assets/js/product-data.js"></script>
    <script src="assets/js/product.js"></script>

</body>

</html>
