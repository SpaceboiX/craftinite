<!DOCTYPE html>
<html data-bs-theme="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Checkout - Craftinite</title>

    <meta property="og:image" content="assets/img/icons/meta.png">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,600,700&display=swap">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <div class="container py-5">
        <h1 class="mb-4">Checkout</h1>

        <div class="checkout-wrapper">
            <h4 class="mb-3">Your Items</h4>
            <div id="checkout-items"></div>

            <hr class="my-4">

            <h4 class="mb-3">Order Summary</h4>
            <div class="summary-box">
                <p class="mb-1">Subtotal: £<span id="subtotal">0.00</span></p>
                <p class="mb-1">Total Weight: <span id="total-weight">0</span> g</p>
                <p class="mb-1">Shipping: £<span id="shipping">0.00</span></p>
                <hr>
                <h5>Total: £<span id="grand-total">0.00</span></h5>
            </div>

            <button class="btn btn-primary mt-4 w-100">Proceed to Payment</button>
        </div>
    </div>

    <footer class="bg-dark">
        <div class="container py-4 py-lg-5">
            <div class="text-muted d-flex justify-content-between align-items-center pt-3">
                <p class="mb-0">Copyright © 2025 Craftinite</p>
            </div>
        </div>
    </footer>

    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/product-data.js"></script>

    <script>
        // Example shipping formula:
        // £1.50 base + £0.01 per gram
        function calculateShipping(weight) {
            return 1.50 + (weight * 0.01);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const checkoutContainer = document.getElementById("checkout-items");

            const cart = JSON.parse(localStorage.getItem("cart")) || [];

            let subtotal = 0;
            let totalWeight = 0;

            cart.forEach(item => {
                const product = products.find(p => p.id === item.id);
                if (!product) return;

                const itemTotal = product.price * item.quantity;
                const itemWeight = product.weight * item.quantity;

                subtotal += itemTotal;
                totalWeight += itemWeight;

                const div = document.createElement("div");
                div.className = "checkout-item";

                div.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">${product.name}</h5>
                            <p class="mb-0 text-muted">£${product.price.toFixed(2)} × ${item.quantity}</p>
                            <p class="mb-0 text-muted">Weight: ${product.weight}g each</p>
                        </div>
                        <h5 class="mb-0">£${itemTotal.toFixed(2)}</h5>
                    </div>
                `;

                checkoutContainer.appendChild(div);
            });

            const shipping = calculateShipping(totalWeight);
            const grandTotal = subtotal + shipping;

            document.getElementById("subtotal").textContent = subtotal.toFixed(2);
            document.getElementById("total-weight").textContent = totalWeight;
            document.getElementById("shipping").textContent = shipping.toFixed(2);
            document.getElementById("grand-total").textContent = grandTotal.toFixed(2);
        });
    </script>
</body>

</html>
